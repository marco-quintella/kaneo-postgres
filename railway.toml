[build]
builder = "DOCKERFILE"

[deploy]
# Sem startCommand: a imagem tem entrypoint próprio (kaneo-entrypoint.sh)
# que espera o banco ficar pronto, roda migrations e sobe nginx + API.
healthcheckPath = "/api/health"
# Startup lento na 1a vez: migrations + bootstrap do nginx (~30-60s)
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ⚠️ PORT=5173 é OBRIGATÓRIO como variável do serviço (default no wizard):
# o Railway roteia healthcheck/tráfego pela env var PORT e NÃO pelo EXPOSE
# do Dockerfile. Sem PORT o deploy sobe mas o healthcheck falha (validado
# em deploy real — ver README).

# Nota: variáveis de template (prompts do wizard) são configuradas na UI do
# Railway ao criar/publicar o template (Dashboard → Templates), NÃO aqui.
# Ver docs/STRATEGY.md → "Template variables na UI".
